<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>단어 제출 앱</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 for beautiful popups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans KR', 'Inter', sans-serif; background-color: #f3f4f6; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="w-full min-h-screen flex flex-col items-center">

<!-- Header -->
<div class="w-full bg-white shadow-sm py-3 px-4 text-center border-b border-gray-200">
    <p class="text-xs text-gray-500 font-semibold tracking-wide">개발자 : 가치있는 미래교육 연구소 대표 김병찬</p>
</div>

<!-- Main Container -->
<main class="flex-1 w-full max-w-md mx-auto p-4 flex flex-col justify-center">
    
    <!-- Loading State -->
    <div id="loading-view" class="flex flex-col items-center justify-center py-20">
        <div class="spinner mb-4"></div>
        <p id="loading-text" class="text-gray-500 font-medium">연수 정보를 불러오는 중입니다...</p>
    </div>

    <!-- Content View -->
    <div id="content-view" class="hidden bg-white rounded-2xl shadow-lg p-6 w-full fade-in">
        <div class="text-center mb-6">
            <span id="target-badge" class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full font-bold mb-2"></span>
            <h1 id="title-text" class="text-xl font-bold text-gray-800 mb-4 break-keep"></h1>
            <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
                <p id="question-text" class="text-lg font-semibold text-gray-700 break-keep"></p>
            </div>
        </div>

        <form id="word-form" class="space-y-4">
            <div id="inputs-container" class="space-y-3">
                <!-- Inputs will be injected here -->
            </div>
            
            <button type="submit" id="submit-btn" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200 ease-in-out transform hover:scale-[1.02]">
                단어 제출하기
            </button>
        </form>
    </div>
</main>

<script>
    // ==============================================================================
    // [중요] 아래 GAS_URL 변수에 복사한 Apps Script '웹 앱 URL'을 반드시 붙여넣으세요!
    // ==============================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx0G23gNrwNmS8knwhixqmbmRAt6ovdw63w1NAVbWd7JPZ_XS3HYWJcBygZiYecfKQ/exec"; 
    
    let currentSettings = null;

    document.addEventListener("DOMContentLoaded", () => {
        if(GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE" || !GAS_URL.startsWith("http")) {
            Swal.fire({ icon: 'warning', title: '설정 오류', text: 'HTML 코드 내의 GAS_URL에 실제 Apps Script 주소를 입력해주세요.' });
            document.querySelector('.spinner').style.display = 'none';
            document.getElementById('loading-text').innerHTML = '<span class="text-red-500 font-bold">GAS_URL 설정이 필요합니다.</span>';
            return; 
        }
        fetchSettings();
    });

    async function fetchSettings() {
        try {
            // [수정됨] 브라우저 캐싱 방지용 타임스탬프 추가
            const response = await fetch(`${GAS_URL}?action=getState&t=${new Date().getTime()}`);
            const data = await response.json();
            
            if(data.error) throw new Error(data.error);
            
            currentSettings = data;
            renderUI(data);
            
        } catch (error) {
            Swal.fire({ icon: 'error', title: '연결 실패', text: '데이터를 불러오지 못했습니다. 네트워크 상태나 URL을 확인해주세요.' });
            console.error(error);
        }
    }

    function renderUI(data) {
        document.getElementById('loading-view').classList.add('hidden');
        document.getElementById('content-view').classList.remove('hidden');

        document.getElementById('title-text').innerText = data.title;
        document.getElementById('target-badge').innerText = data.target;
        document.getElementById('question-text').innerText = data.question;

        const container = document.getElementById('inputs-container');
        container.innerHTML = '';
        
        for (let i = 0; i < data.numInputs; i++) {
            const inputWrapper = document.createElement('div');
            inputWrapper.innerHTML = `
                <div class="relative">
                    <input type="text" class="word-input w-full pl-4 pr-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm" placeholder="단어를 입력하세요 (${i+1})" required autocomplete="off">
                </div>
            `;
            container.appendChild(inputWrapper);
        }
    }

    document.getElementById('word-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const inputs = document.querySelectorAll('.word-input');
        const words = Array.from(inputs).map(input => input.value.trim()).filter(val => val.length > 0);
        
        if (words.length === 0) {
            Swal.fire({ icon: 'warning', title: '입력 확인', text: '최소 한 개 이상의 단어를 입력해주세요.' });
            return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner inline-block w-5 h-5 border-2 border-white border-left-transparent mr-2 align-middle"></span> 처리중...`;

        try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'submitWords', words: words })
            });
            const result = await response.json();
            
            if (result.success) {
                Swal.fire({
                    icon: 'success',
                    title: '제출 완료!',
                    text: '단어가 성공적으로 접수되었습니다.',
                    confirmButtonColor: '#3b82f6',
                    confirmButtonText: '확인'
                }).then(() => {
                    inputs.forEach(input => input.value = ''); 
                });
            } else {
                throw new Error(result.error);
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: '오류 발생', text: '제출 중 문제가 발생했습니다. 다시 시도해주세요.' });
            console.error(error);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '단어 제출하기';
        }
    });
</script>
</body>
</html>
